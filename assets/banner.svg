<svg viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" width="900" height="260">
  <defs>
    <!-- Deep espresso background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0A0806"/>
      <stop offset="45%"  stop-color="#0F0A07"/>
      <stop offset="100%" stop-color="#0C0907"/>
    </linearGradient>

    <!-- Warm amber left glow -->
    <radialGradient id="glowLeft" cx="20%" cy="55%" r="50%">
      <stop offset="0%"   stop-color="#7A5C45" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#7A5C45" stop-opacity="0"/>
    </radialGradient>

    <!-- Cream right glow -->
    <radialGradient id="glowRight" cx="80%" cy="45%" r="50%">
      <stop offset="0%"   stop-color="#C9AE8A" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#C9AE8A" stop-opacity="0"/>
    </radialGradient>

    <!-- Center warmth -->
    <radialGradient id="glowCenter" cx="50%" cy="50%" r="40%">
      <stop offset="0%"   stop-color="#4A2C1D" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#4A2C1D" stop-opacity="0"/>
    </radialGradient>

    <!-- Title gradient: latte → cream -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#C9AE8A"/>
      <stop offset="40%"  stop-color="#F5F1E8"/>
      <stop offset="100%" stop-color="#7A5C45"/>
    </linearGradient>

    <!-- Subtitle gradient -->
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#7A5C45" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#C9AE8A" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Coffee fill gradient (mug) -->
    <linearGradient id="coffeeDeep" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#C9AE8A" stop-opacity="0.95"/>
      <stop offset="18%"  stop-color="#7A5C45"/>
      <stop offset="42%"  stop-color="#4A2C1D"/>
      <stop offset="72%"  stop-color="#2B1810"/>
      <stop offset="100%" stop-color="#1A0E09"/>
    </linearGradient>

    <!-- Mug body gradient -->
    <linearGradient id="mugBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#2B1810"/>
      <stop offset="30%"  stop-color="#3D2218"/>
      <stop offset="70%"  stop-color="#3D2218"/>
      <stop offset="100%" stop-color="#2B1810"/>
    </linearGradient>

    <!-- Mug shine -->
    <linearGradient id="mugShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#F5F1E8" stop-opacity="0"/>
      <stop offset="35%"  stop-color="#F5F1E8" stop-opacity="0.07"/>
      <stop offset="50%"  stop-color="#F5F1E8" stop-opacity="0.13"/>
      <stop offset="65%"  stop-color="#F5F1E8" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#F5F1E8" stop-opacity="0"/>
    </linearGradient>

    <!-- Side bar gradient (warm) -->
    <linearGradient id="barLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#4A2C1D" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#7A5C45" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#4A2C1D" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="barRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#4A2C1D" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#C9AE8A" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#4A2C1D" stop-opacity="0"/>
    </linearGradient>

    <!-- Steam gradients -->
    <linearGradient id="steam1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%"   stop-color="#C9AE8A" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#C9AE8A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="steam2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%"   stop-color="#F5F1E8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#F5F1E8" stop-opacity="0"/>
    </linearGradient>

    <!-- Foam gradient -->
    <linearGradient id="foamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#F5F1E8"/>
      <stop offset="100%" stop-color="#C9AE8A"/>
    </linearGradient>

    <!-- Clip path for coffee fill inside mug -->
    <clipPath id="mugClip">
      <rect x="638" y="78" width="144" height="148" rx="4"/>
    </clipPath>

    <!-- Glow filters -->
    <filter id="softglow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="steamBlur">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="warmGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="1"/>
    </filter>
  </defs>

  <!-- ── BASE ── -->
  <rect width="900" height="260" fill="url(#bgGrad)"/>
  <rect width="900" height="260" fill="url(#glowLeft)"/>
  <rect width="900" height="260" fill="url(#glowRight)"/>
  <rect width="900" height="260" fill="url(#glowCenter)"/>

  <!-- Subtle texture grid -->
  <line x1="0" y1="52"  x2="900" y2="52"  stroke="#C9AE8A" stroke-width="0.25" opacity="0.04"/>
  <line x1="0" y1="104" x2="900" y2="104" stroke="#C9AE8A" stroke-width="0.25" opacity="0.04"/>
  <line x1="0" y1="156" x2="900" y2="156" stroke="#C9AE8A" stroke-width="0.25" opacity="0.04"/>
  <line x1="0" y1="208" x2="900" y2="208" stroke="#C9AE8A" stroke-width="0.25" opacity="0.04"/>
  <line x1="150" y1="0" x2="150" y2="260" stroke="#7A5C45" stroke-width="0.25" opacity="0.04"/>
  <line x1="300" y1="0" x2="300" y2="260" stroke="#7A5C45" stroke-width="0.25" opacity="0.04"/>
  <line x1="450" y1="0" x2="450" y2="260" stroke="#C9AE8A" stroke-width="0.25" opacity="0.03"/>
  <line x1="600" y1="0" x2="600" y2="260" stroke="#7A5C45" stroke-width="0.25" opacity="0.04"/>
  <line x1="750" y1="0" x2="750" y2="260" stroke="#7A5C45" stroke-width="0.25" opacity="0.04"/>

  <!-- Top border dual-tone -->
  <rect x="0"   y="0" width="450" height="1.5" fill="#7A5C45" opacity="0.8"/>
  <rect x="450" y="0" width="450" height="1.5" fill="#C9AE8A" opacity="0.8"/>

  <!-- Bottom border dual-tone -->
  <rect x="0"   y="258.5" width="450" height="1.5" fill="#7A5C45" opacity="0.8"/>
  <rect x="450" y="258.5" width="450" height="1.5" fill="#C9AE8A" opacity="0.8"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="3" height="260" fill="url(#barLeft)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3.2s" repeatCount="indefinite"/>
  </rect>

  <!-- Right accent bar -->
  <rect x="897" y="0" width="3" height="260" fill="url(#barRight)">
    <animate attributeName="opacity" values="1;0.5;1" dur="3.2s" repeatCount="indefinite"/>
  </rect>

  <!-- Corner brackets — top left -->
  <polyline points="5,28 5,5 28,5" fill="none" stroke="#7A5C45" stroke-width="2" opacity="0.9"/>
  <!-- Corner brackets — top right -->
  <polyline points="872,5 895,5 895,28" fill="none" stroke="#C9AE8A" stroke-width="2" opacity="0.9"/>
  <!-- Corner brackets — bottom left -->
  <polyline points="5,232 5,255 28,255" fill="none" stroke="#7A5C45" stroke-width="2" opacity="0.9"/>
  <!-- Corner brackets — bottom right -->
  <polyline points="872,255 895,255 895,232" fill="none" stroke="#C9AE8A" stroke-width="2" opacity="0.9"/>

  <!-- Scan sweep -->
  <rect x="5" y="0" width="890" height="1.2" fill="#F5F1E8" opacity="0.025" filter="url(#blur1)">
    <animateTransform attributeName="transform" type="translate" from="0,0" to="0,260" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- ══════════════════════════════════════════════════ -->
  <!-- ── LEFT SIDE: TEXT CONTENT ── -->
  <!-- ══════════════════════════════════════════════════ -->

  <!-- Name shadow/glow -->
  <text x="52" y="108"
        font-family="'Georgia', 'Times New Roman', serif"
        font-size="46" font-weight="700" letter-spacing="3"
        fill="#7A5C45" opacity="0.35" filter="url(#warmGlow)">LUKE CLINE</text>

  <!-- Name primary -->
  <text x="52" y="108"
        font-family="'Georgia', 'Times New Roman', serif"
        font-size="46" font-weight="700" letter-spacing="3"
        fill="url(#titleGrad)" opacity="0.98">LUKE CLINE</text>

  <!-- Role line -->
  <text x="54" y="133"
        font-family="'Courier New', Courier, monospace"
        font-size="11" letter-spacing="5"
        fill="#C9AE8A" opacity="0.75">FOUNDER  ·  CEO  ·  BUILDER</text>

  <!-- Thin rule under role -->
  <line x1="52" y1="143" x2="380" y2="143" stroke="#4A2C1D" stroke-width="0.8" opacity="0.7"/>

  <!-- Tagline -->
  <text x="54" y="162"
        font-family="'Courier New', Courier, monospace"
        font-size="10" letter-spacing="2"
        fill="#7A5C45" opacity="0.9">Building AI-native products, systems, and companies.</text>

  <!-- Currently Brewing label -->
  <text x="54" y="188"
        font-family="'Courier New', Courier, monospace"
        font-size="8" letter-spacing="4"
        fill="#4A2C1D" opacity="0.8">CURRENTLY BREWING</text>

  <!-- Brewing dot -->
  <circle cx="46" cy="185" r="3" fill="#C9AE8A" opacity="0.85">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- Products -->
  <text x="54" y="205"
        font-family="'Courier New', Courier, monospace"
        font-size="10" letter-spacing="2"
        fill="#C9AE8A" opacity="0.9">→  AGNTQS</text>
  <text x="54" y="220"
        font-family="'Courier New', Courier, monospace"
        font-size="10" letter-spacing="2"
        fill="#C9AE8A" opacity="0.75">→  Beyond Norme</text>
  <text x="54" y="235"
        font-family="'Courier New', Courier, monospace"
        font-size="10" letter-spacing="2"
        fill="#C9AE8A" opacity="0.6">→  Cloud Cosmetics</text>

  <!-- ══════════════════════════════════════════════════ -->
  <!-- ── CENTER: DIVIDER + WORDMARK ── -->
  <!-- ══════════════════════════════════════════════════ -->

  <!-- Vertical center rule -->
  <line x1="450" y1="24" x2="450" y2="236" stroke="#4A2C1D" stroke-width="0.8" opacity="0.5"/>

  <!-- Center wordmark (subtle, low) -->
  <text x="450" y="248" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="7.5" letter-spacing="4"
        fill="#F5F1E8" opacity="0.12">BEYOND NORME INC.  ·  AI-NATIVE INFRASTRUCTURE  ·  LOS ANGELES</text>

  <!-- ══════════════════════════════════════════════════ -->
  <!-- ── RIGHT SIDE: COFFEE MUG ── -->
  <!-- ══════════════════════════════════════════════════ -->

  <!-- Mug warm glow behind -->
  <ellipse cx="710" cy="160" rx="90" ry="80" fill="#4A2C1D" opacity="0.18" filter="url(#warmGlow)"/>

  <!-- === STEAM === -->
  <!-- Steam strand 1 (left) -->
  <path d="M 678 80 Q 668 65 678 50 Q 688 35 678 20" fill="none" stroke="url(#steam1)" stroke-width="2.5" stroke-linecap="round" filter="url(#steamBlur)">
    <animate attributeName="d"
      values="M 678 80 Q 668 65 678 50 Q 688 35 678 20;
              M 678 80 Q 690 65 678 50 Q 666 35 678 20;
              M 678 80 Q 668 65 678 50 Q 688 35 678 20"
      dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.3;0.7" dur="3.5s" repeatCount="indefinite"/>
  </path>

  <!-- Steam strand 2 (center) -->
  <path d="M 710 74 Q 698 58 710 42 Q 722 26 710 12" fill="none" stroke="url(#steam2)" stroke-width="2" stroke-linecap="round" filter="url(#steamBlur)">
    <animate attributeName="d"
      values="M 710 74 Q 698 58 710 42 Q 722 26 710 12;
              M 710 74 Q 722 58 710 42 Q 698 26 710 12;
              M 710 74 Q 698 58 710 42 Q 722 26 710 12"
      dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="4s" repeatCount="indefinite"/>
  </path>

  <!-- Steam strand 3 (right) -->
  <path d="M 742 80 Q 754 64 742 48 Q 730 32 742 18" fill="none" stroke="url(#steam1)" stroke-width="2.5" stroke-linecap="round" filter="url(#steamBlur)">
    <animate attributeName="d"
      values="M 742 80 Q 754 64 742 48 Q 730 32 742 18;
              M 742 80 Q 730 64 742 48 Q 754 32 742 18;
              M 742 80 Q 754 64 742 48 Q 730 32 742 18"
      dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3s" repeatCount="indefinite"/>
  </path>

  <!-- === MUG BODY === -->
  <!-- Outer mug shape -->
  <path d="M 635 78 L 647 228 Q 648 234 655 234 L 765 234 Q 772 234 773 228 L 785 78 Z"
        fill="url(#mugBody)" stroke="#4A2C1D" stroke-width="1.5" opacity="0.95"/>

  <!-- Coffee layers fill (clipped) -->
  <g clip-path="url(#mugClip)">
    <!-- Layer 5: Espresso dark base -->
    <rect x="635" y="168" width="150" height="62" fill="#1A0E09"/>
    <!-- Layer 4: Dark roast -->
    <rect x="635" y="138" width="150" height="33" fill="#2B1810"/>
    <!-- Layer 3: Medium roast -->
    <rect x="635" y="114" width="150" height="27" fill="#4A2C1D"/>
    <!-- Layer 2: Latte brown -->
    <rect x="635" y="95" width="150" height="22" fill="#7A5C45"/>
    <!-- Layer 1: Oat milk / foam top -->
    <rect x="635" y="82" width="150" height="16" fill="#C9AE8A"/>
    <!-- Foam highlights -->
    <ellipse cx="670" cy="86" rx="18" ry="6" fill="#F5F1E8" opacity="0.6"/>
    <ellipse cx="720" cy="84" rx="12" ry="4" fill="#F5F1E8" opacity="0.4"/>
    <ellipse cx="750" cy="87" rx="10" ry="5" fill="#F5F1E8" opacity="0.35"/>
    <!-- Roastery latte art (simple heart/swirl) -->
    <path d="M 700 90 Q 706 84 710 90 Q 714 84 720 90 Q 715 97 710 103 Z" fill="#4A2C1D" opacity="0.55"/>
  </g>

  <!-- Mug shine overlay -->
  <path d="M 635 78 L 647 228 Q 648 234 655 234 L 765 234 Q 772 234 773 228 L 785 78 Z"
        fill="url(#mugShine)"/>

  <!-- Mug rim top -->
  <rect x="633" y="74" width="154" height="8" rx="3" fill="#3D2218" stroke="#5A3825" stroke-width="1"/>

  <!-- Mug base -->
  <rect x="645" y="230" width="130" height="8" rx="3" fill="#2B1810" stroke="#4A2C1D" stroke-width="1"/>

  <!-- Mug handle -->
  <path d="M 783 108 Q 820 108 820 150 Q 820 192 783 192"
        fill="none" stroke="#3D2218" stroke-width="14" stroke-linecap="round"/>
  <path d="M 783 108 Q 814 108 814 150 Q 814 192 783 192"
        fill="none" stroke="#4A2C1D" stroke-width="8" stroke-linecap="round"/>
  <!-- Handle inner highlight -->
  <path d="M 783 120 Q 806 120 806 150 Q 806 180 783 180"
        fill="none" stroke="#5A3825" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>

  <!-- Progress level lines on mug (subtle) -->
  <line x1="638" y1="135" x2="782" y2="135" stroke="#7A5C45" stroke-width="0.6" opacity="0.3"/>
  <line x1="638" y1="110" x2="782" y2="110" stroke="#C9AE8A" stroke-width="0.6" opacity="0.25"/>

  <!-- ── TOP-LEFT STATUS ── -->
  <circle cx="18" cy="20" r="3.5" fill="#C9AE8A" opacity="0.9">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="r" values="2.5;4.5;2.5" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <text x="30" y="25"
        font-family="'Courier New', Courier, monospace"
        font-size="8.5" fill="#C9AE8A" opacity="0.7" letter-spacing="2">SYSTEM ONLINE</text>

  <!-- ── TOP-RIGHT ── -->
  <text x="884" y="25" text-anchor="end"
        font-family="'Courier New', Courier, monospace"
        font-size="8.5" fill="#7A5C45" opacity="0.75" letter-spacing="2">BEYOND NORME INC.</text>

  <!-- ── BOTTOM-LEFT ── -->
  <text x="18" y="248"
        font-family="'Courier New', Courier, monospace"
        font-size="8" fill="#7A5C45" opacity="0.4" letter-spacing="2">LOS ANGELES, CA</text>

  <!-- ── BOTTOM-RIGHT: BUILDING status ── -->
  <circle cx="808" cy="246" r="3" fill="#7A5C45" opacity="0.9">
    <animate attributeName="r" values="2.5;4;2.5" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="820" y="250"
        font-family="'Courier New', Courier, monospace"
        font-size="8.5" fill="#C9AE8A" opacity="0.75" letter-spacing="2">BUILDING</text>

  <!-- Blinking cursor -->
  <rect x="872" y="237" width="6" height="13" fill="#C9AE8A" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0;0.7" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
