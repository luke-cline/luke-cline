<svg viewBox="0 0 900 240" xmlns="http://www.w3.org/2000/svg" width="900" height="240">
  <defs>
    <!-- Deep charcoal background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0d0d12"/>
      <stop offset="40%"  stop-color="#131320"/>
      <stop offset="100%" stop-color="#0a0a10"/>
    </linearGradient>

    <!-- Magenta glow left -->
    <radialGradient id="glowLeft" cx="10%" cy="50%" r="45%">
      <stop offset="0%"   stop-color="#d400ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#d400ff" stop-opacity="0"/>
    </radialGradient>

    <!-- Ice blue glow right -->
    <radialGradient id="glowRight" cx="90%" cy="50%" r="45%">
      <stop offset="0%"   stop-color="#7df9ff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#7df9ff" stop-opacity="0"/>
    </radialGradient>

    <!-- Center title glow -->
    <radialGradient id="glowCenter" cx="50%" cy="50%" r="40%">
      <stop offset="0%"   stop-color="#d400ff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#7df9ff" stop-opacity="0"/>
    </radialGradient>

    <!-- Title text gradient: magenta → ice blue -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#d400ff"/>
      <stop offset="50%"  stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#7df9ff"/>
    </linearGradient>

    <!-- Subtitle gradient -->
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#d400ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#7df9ff" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Side bar gradients -->
    <linearGradient id="barLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#d400ff" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#d400ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#d400ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="barRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#7df9ff" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#7df9ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7df9ff" stop-opacity="0"/>
    </linearGradient>

    <!-- Scan line filter -->
    <filter id="blur2">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Base background -->
  <rect width="900" height="240" fill="url(#bgGrad)"/>

  <!-- Ambient glows -->
  <rect width="900" height="240" fill="url(#glowLeft)"/>
  <rect width="900" height="240" fill="url(#glowRight)"/>
  <rect width="900" height="240" fill="url(#glowCenter)"/>

  <!-- Grid: horizontal lines -->
  <line x1="0" y1="48"  x2="900" y2="48"  stroke="#7df9ff" stroke-width="0.3" opacity="0.06"/>
  <line x1="0" y1="96"  x2="900" y2="96"  stroke="#7df9ff" stroke-width="0.3" opacity="0.06"/>
  <line x1="0" y1="144" x2="900" y2="144" stroke="#7df9ff" stroke-width="0.3" opacity="0.06"/>
  <line x1="0" y1="192" x2="900" y2="192" stroke="#7df9ff" stroke-width="0.3" opacity="0.06"/>

  <!-- Grid: vertical lines -->
  <line x1="100" y1="0" x2="100" y2="240" stroke="#d400ff" stroke-width="0.3" opacity="0.05"/>
  <line x1="200" y1="0" x2="200" y2="240" stroke="#d400ff" stroke-width="0.3" opacity="0.05"/>
  <line x1="300" y1="0" x2="300" y2="240" stroke="#d400ff" stroke-width="0.3" opacity="0.05"/>
  <line x1="450" y1="0" x2="450" y2="240" stroke="#ffffff" stroke-width="0.3" opacity="0.04"/>
  <line x1="600" y1="0" x2="600" y2="240" stroke="#7df9ff" stroke-width="0.3" opacity="0.05"/>
  <line x1="700" y1="0" x2="700" y2="240" stroke="#7df9ff" stroke-width="0.3" opacity="0.05"/>
  <line x1="800" y1="0" x2="800" y2="240" stroke="#7df9ff" stroke-width="0.3" opacity="0.05"/>

  <!-- Top border: dual-tone -->
  <rect x="0" y="0" width="450" height="1.2" fill="#d400ff" opacity="0.7"/>
  <rect x="450" y="0" width="450" height="1.2" fill="#7df9ff" opacity="0.7"/>

  <!-- Bottom border: dual-tone -->
  <rect x="0" y="238.8" width="450" height="1.2" fill="#d400ff" opacity="0.7"/>
  <rect x="450" y="238.8" width="450" height="1.2" fill="#7df9ff" opacity="0.7"/>

  <!-- Left accent bar (magenta) -->
  <rect x="0" y="0" width="3" height="240" fill="url(#barLeft)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2.6s" repeatCount="indefinite"/>
  </rect>

  <!-- Right accent bar (ice blue) -->
  <rect x="897" y="0" width="3" height="240" fill="url(#barRight)">
    <animate attributeName="opacity" values="1;0.6;1" dur="2.6s" repeatCount="indefinite"/>
  </rect>

  <!-- Corner brackets — top left (magenta) -->
  <polyline points="4,30 4,4 30,4" fill="none" stroke="#d400ff" stroke-width="2.2" opacity="0.9"/>
  <!-- Corner brackets — top right (ice blue) -->
  <polyline points="870,4 896,4 896,30" fill="none" stroke="#7df9ff" stroke-width="2.2" opacity="0.9"/>
  <!-- Corner brackets — bottom left (magenta) -->
  <polyline points="4,210 4,236 30,236" fill="none" stroke="#d400ff" stroke-width="2.2" opacity="0.9"/>
  <!-- Corner brackets — bottom right (ice blue) -->
  <polyline points="870,236 896,236 896,210" fill="none" stroke="#7df9ff" stroke-width="2.2" opacity="0.9"/>

  <!-- Scan line sweep -->
  <rect x="4" y="0" width="892" height="1.5" fill="#ffffff" opacity="0.04" filter="url(#blur2)">
    <animateTransform attributeName="transform" type="translate" from="0,0" to="0,240" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- ── MAIN WORDMARK ── -->
  <!-- Shadow/glow layer -->
  <text x="450" y="118" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="58" font-weight="900" letter-spacing="14"
        fill="#d400ff" opacity="0.25" filter="url(#glowStrong)">BEYOND NORME</text>

  <!-- Primary title -->
  <text x="450" y="118" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="58" font-weight="900" letter-spacing="14"
        fill="url(#titleGrad)" opacity="0.97">BEYOND NORME</text>

  <!-- Subtitle rule left -->
  <line x1="60" y1="146" x2="280" y2="146" stroke="url(#subGrad)" stroke-width="0.8" opacity="0.5"/>
  <!-- Subtitle rule right -->
  <line x1="620" y1="146" x2="840" y2="146" stroke="url(#subGrad)" stroke-width="0.8" opacity="0.5"/>

  <!-- Subtitle -->
  <text x="450" y="151" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="11" fill="url(#subGrad)" letter-spacing="8" opacity="0.9">
    INC.  ·  AI-NATIVE INFRASTRUCTURE  ·  LOS ANGELES
  </text>

  <!-- ── TOP-LEFT STATUS ── -->
  <!-- Pulsing dot (magenta) -->
  <circle cx="22" cy="22" r="4" fill="#d400ff" opacity="0.9">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="34" y="27"
        font-family="'Courier New', Courier, monospace"
        font-size="9" fill="#d400ff" opacity="0.75" letter-spacing="2">SYSTEM ONLINE</text>

  <!-- ── TOP-RIGHT ROLE ── -->
  <text x="876" y="27" text-anchor="end"
        font-family="'Courier New', Courier, monospace"
        font-size="9" fill="#7df9ff" opacity="0.75" letter-spacing="2">FOUNDER &amp; CEO</text>

  <!-- ── BOTTOM-LEFT ── -->
  <text x="22" y="216"
        font-family="'Courier New', Courier, monospace"
        font-size="9" fill="#d400ff" opacity="0.45" letter-spacing="2">AGNTQS · BEYOND NORME · CLOUD COSMETICS</text>

  <!-- ── BOTTOM-RIGHT STATUS ── -->
  <circle cx="810" cy="214" r="3.5" fill="#39ff7a" opacity="0.85">
    <animate attributeName="r" values="3;5;3" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <text x="822" y="218"
        font-family="'Courier New', Courier, monospace"
        font-size="9" fill="#39ff7a" opacity="0.8" letter-spacing="2">BUILDING</text>

  <!-- Blinking cursor -->
  <rect x="872" y="203" width="7" height="14" fill="#39ff7a" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0;0.8" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- ── CENTER BOTTOM: tech stack micro-line ── -->
  <text x="450" y="228" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="8" fill="#ffffff" opacity="0.18" letter-spacing="3">
    NEXT.JS · TYPESCRIPT · SUPABASE · EXPO EAS · CUSTOM AGENT LOOPS
  </text>
</svg>
